; Redis for crawl4ai's job queue (docs/decisions/0005). Upstream's own image directory
; /var/lib/redis is root-owned and unwritable to appuser on a read-only root; this package's
; redis --dir is /run/redis, created and chowned by start.sh on every boot.
[program:redis]
command=/usr/bin/redis-server /run/redis/redis.conf
user=cloudron
directory=/run/redis
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
