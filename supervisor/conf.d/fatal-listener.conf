; Fail loud (docs/decisions, per the estate's field guide): if gunicorn or redis crash-loops into
; FATAL, shut supervisord down so the container exits and the platform sees a dead container,
; rather than sitting up with a healthcheck that the platform never re-probes on its own.
[eventlistener:fatal-exit]
command=python3 /app/code/supervisor/fatal-exit-listener.py
events=PROCESS_STATE_FATAL
user=cloudron
priority=5
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
