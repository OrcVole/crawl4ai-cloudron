; The crawl4ai API server, run exactly as upstream's own supervisord.conf runs it (same command,
; same working directory), started only after start.sh has written the effective config and
; seeded the API token.
[program:gunicorn]
command=/usr/local/bin/gunicorn --bind "%(ENV_GUNICORN_BIND)s" --workers 1 --threads 4 --timeout 1800 --graceful-timeout 30 --keep-alive 300 --log-level info --limit-request-line 8190 --limit-request-fields 100 --worker-class uvicorn.workers.UvicornWorker server:app
directory=/app/code/c4ai
user=cloudron
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
environment=PYTHONUNBUFFERED=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
