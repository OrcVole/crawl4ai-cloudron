; supervisord main config for the crawl4ai Cloudron package.
;
; supervisord itself runs as root (started by start.sh via tini); each program below drops to
; user=cloudron individually. pidfile and the unix control socket live under /run, created and
; chowned by start.sh on every boot (/run does not persist across restarts).

[unix_http_server]
file=/run/supervisor/supervisor.sock
chown=root:cloudron
chmod=0770

[supervisord]
user=root
pidfile=/run/supervisor/supervisord.pid
logfile=/dev/fd/1
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[include]
files = /app/code/supervisor/conf.d/*.conf
